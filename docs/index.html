<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qeflo | قفلو - الموبايل مقفول لحد ما تذاكر</title>
<meta name="description" content="Qeflo locks your distractions during study time and only opens when you pass a quick exam on what you studied.">
<meta name="theme-color" content="#0E1B2E">
<link rel="icon" href="logo.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="Qeflo | قفلو"><meta property="og:description" content="Study lock that opens only after you pass a quick exam on what you studied."><meta property="og:locale" content="ar_EG"><meta property="og:type" content="website"><meta property="og:image" content="https://yousefkhames.github.io/qeflo/og.png"><meta property="og:url" content="https://yousefkhames.github.io/qeflo/"><meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://yousefkhames.github.io/qeflo/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>
<header class="top">
  <a class="brand" href="#home"><img src="logo.svg" alt="" width="34" height="34"><span>Qeflo <small>قفلو</small></span></a>
  <nav aria-label="Main">
    <a href="#home" data-v="home" data-i="nav_home"></a>
    <a href="#bank" data-v="bank" data-i="nav_bank"></a>
    <a href="#stats" data-v="stats" data-i="nav_stats"></a>
    <button id="installBtn" class="ghost" hidden data-i="install"></button><button id="snd" class="ghost" aria-pressed="true" aria-label="sound">🔊</button><button id="lang" class="ghost"></button>
  </nav>
</header>

<noscript><p style="padding:24px;color:#fff">Qeflo needs JavaScript. / قفلو محتاج جافاسكريبت.</p></noscript>
<main id="main" tabindex="-1">
<section id="home" class="view">
  <div class="hero">
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
    <div class="how">
      <div><b>1</b><span data-i="s1"></span></div>
      <div><b>2</b><span data-i="s2"></span></div>
      <div><b>3</b><span data-i="s3"></span></div>
    </div>
  </div>
  <div class="card">
    <div id="goal" class="goal"></div>
    <h2 data-i="start_h"></h2>
    <div class="grid2">
      <label><span data-i="subject"></span><select id="subjectSel"></select></label>
      <label><span data-i="minutes"></span><input id="minutes" type="number" min="1" max="240" value="25"><span class="presets" role="group" aria-label="presets"><button type="button" class="chip pre" data-m="15">15</button><button type="button" class="chip pre" data-m="25">25</button><button type="button" class="chip pre" data-m="45">45</button><button type="button" class="chip pre" data-m="90">90</button></span></label>
      <label><span data-i="qcount"></span><input id="qcount" type="number" min="3" max="20" value="5"></label>
      <label><span data-i="pass"></span><input id="passPct" type="number" min="50" max="100" value="80"></label>
    </div>
    <button type="button" class="ghost big" id="practiceBtn" data-i="practice"></button>
    <label class="chk"><input type="checkbox" id="strict" checked> <span data-i="strict"></span></label>
    <button id="startBtn" class="primary big" data-i="start_btn"></button>
    <p class="hint" data-i="honest"></p>
  </div>
  <div class="card" id="faq">
    <h2 data-i="faq_h"></h2>
    <details><summary data-i="f1q"></summary><p data-i="f1a"></p></details>
    <details><summary data-i="f2q"></summary><p data-i="f2a"></p></details>
    <details><summary data-i="f3q"></summary><p data-i="f3a"></p></details>
    <details><summary data-i="f4q"></summary><p data-i="f4a"></p></details>
    <div class="row"><button id="shareBtn" class="primary" data-i="share"></button><a class="ghost linkbtn" href="https://github.com/yousefkhames/qeflo" target="_blank" rel="noopener">GitHub</a></div>
  </div>
</section>

<section id="bank" class="view" hidden>
  <div class="card">
    <h2 data-i="bank_h"></h2>
    <div class="row">
      <input id="newSubject" dir="auto" maxlength="60" data-ip="new_subject">
      <button id="addSubject" class="primary" data-i="add"></button>
    </div>
    <div id="subjectList"></div>
  </div>
  <div class="card">
    <h2 data-i="gen_h"></h2>
    <p class="hint" data-i="gen_p"></p>
    <label><span data-i="subject"></span><select id="genSubject"></select></label>
    <textarea id="notes" dir="auto" rows="7" data-ip="notes_ph"></textarea>
    <div class="row"><button id="genBtn" class="primary" data-i="gen_btn"></button><button id="matBtn" class="ghost" data-i="mat_btn"></button></div><p class="hint" data-i="mat_p"></p>
    <div id="genOut"></div>
  </div>
  <div class="card">
    <h2 data-i="manual_h"></h2>
    <label><span data-i="subject"></span><select id="mSubject"></select></label>
    <input id="mQ" dir="auto" maxlength="300" data-ip="q_ph">
    <div class="grid2"><input id="mA" dir="auto" data-ip="a_right"><input id="mB" dir="auto" data-ip="a_wrong1"><input id="mC" dir="auto" data-ip="a_wrong2"><input id="mD" dir="auto" data-ip="a_wrong3"></div>
    <input id="mE" dir="auto" data-ip="expl_ph">
    <button id="mAdd" class="primary" data-i="add"></button>
    <div class="row"><button id="exportBtn" class="ghost" data-i="export"></button><label class="ghost filebtn"><span data-i="import"></span><input type="file" id="importFile" accept="application/json" hidden></label></div>
  </div>
</section>

<section id="stats" class="view" hidden>
  <div class="card"><h2 data-i="stats_h"></h2><div id="kpis" class="kpis"></div><div id="history"></div><button type="button" class="ghost" id="csvBtn" data-i="csv"></button></div>
</section>
</main>

<div id="lock" class="lock" role="dialog" aria-modal="true" aria-label="Qeflo lock" hidden>
  <div class="lockbox">
    <img src="logo.svg" width="64" height="64" alt="">
    <div id="lockState" aria-live="polite" tabindex="-1"></div>
  </div>
</div>

<footer><span data-i="foot"></span></footer>
<script src="app.js"></script>
</body>
</html>
